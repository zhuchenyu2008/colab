name: Build Battery Step Notifier APK

on:
  push:
    branches:
      - battery-step-notifier-build
    paths:
      - 'battery-step-notifier/**'
      - '.github/workflows/battery-step-notifier-build.yml'
  workflow_dispatch:

concurrency:
  group: battery-step-notifier-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPECTED_SIGNING_SHA256: 5b8727a90c908530776fe8a928c56700e095606d71f42c0df58aacf078d87965

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: battery-step-notifier-debug-keystore-v1

      - name: Verify stable signing key
        run: |
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | tee KEYSTORE_CERT.txt
          KEYSTORE_SHA=$(sed -n 's/.*SHA256: //p' KEYSTORE_CERT.txt | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA-256: $KEYSTORE_SHA"
          test "$KEYSTORE_SHA" = "$EXPECTED_SIGNING_SHA256"

      - name: Build and lint
        run: gradle -p battery-step-notifier :app:assembleDebug :app:lintDebug --stacktrace

      - name: Validate APK and signing certificate
        run: |
          APK=battery-step-notifier/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest application-id "$APK"
          apkanalyzer manifest version-name "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          apksigner verify --verbose --print-certs "$APK" | tee SIGNING_CERT.txt
          APK_SIGNING_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' SIGNING_CERT.txt | head -1 | tr '[:upper:]' '[:lower:]')
          echo "APK signing SHA-256: $APK_SIGNING_SHA"
          test "$APK_SIGNING_SHA" = "$EXPECTED_SIGNING_SHA256"
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" BatteryStepNotifier-v20.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryStepNotifier-v20
          path: |
            BatteryStepNotifier-v20.apk
            SHA256SUMS.txt
            SIGNING_CERT.txt
          if-no-files-found: error
          retention-days: 30
