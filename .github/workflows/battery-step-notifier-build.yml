name: Build Battery Step Notifier APK

on:
  push:
    branches:
      - battery-step-notifier-build
    paths:
      - 'battery-step-notifier/**'
      - '.github/workflows/battery-step-notifier-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: battery-step-notifier-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=BatteryStepNotifier Debug, OU=Personal, O=zhuchenyu2008, C=CN"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build and lint
        run: gradle -p battery-step-notifier :app:assembleDebug :app:lintDebug --stacktrace

      - name: Validate APK
        run: |
          APK=battery-step-notifier/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest application-id "$APK"
          apkanalyzer manifest version-name "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" BatteryStepNotifier-v12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryStepNotifier-v12
          path: |
            BatteryStepNotifier-v12.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
