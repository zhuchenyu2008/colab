name: Build Battery Step Notifier APK

on:
  push:
    branches:
      - battery-step-notifier-build
    paths:
      - 'battery-step-notifier/**'
      - '.github/workflows/battery-step-notifier-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: battery-step-notifier-debug-keystore-v1

      - name: Build and lint
        run: gradle -p battery-step-notifier :app:assembleDebug :app:lintDebug --stacktrace

      - name: Validate APK
        run: |
          APK=battery-step-notifier/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest application-id "$APK"
          apkanalyzer manifest version-name "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" BatteryStepNotifier-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BatteryStepNotifier-v3
          path: |
            BatteryStepNotifier-v3.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
