name: Build Health Connect ChatGPT Bridge

on:
  push:
    branches:
      - health-connect-chatgpt-mvp
    paths:
      - 'health-connect-chatgpt/**'
      - '.github/workflows/build-health-connect-chatgpt.yml'
  pull_request:
    paths:
      - 'health-connect-chatgpt/**'
      - '.github/workflows/build-health-connect-chatgpt.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle -p health-connect-chatgpt/android :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthConnect-ChatGPT-Bridge-debug
          path: health-connect-chatgpt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server
        run: pip install -e 'health-connect-chatgpt/server[test]'
      - name: Run tests
        run: pytest -q health-connect-chatgpt/server/tests
      - name: Import smoke test
        env:
          HEALTH_DB: /tmp/health-smoke.db
          INGEST_TOKEN: ci-ingest-token-01234567890123456789
          MCP_TOKEN: ci-mcp-token-01234567890123456789012
        run: python -c 'from health_bridge.app import app; print(type(app).__name__)'
