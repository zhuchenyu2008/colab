name: Build MediaScribe Android APK

on:
  push:
    branches: [ media-scribe-android ]
    paths:
      - 'MediaScribe/**'
      - '.github/workflows/media-scribe-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo 'SDK manager missing'; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p MediaScribe :app:assembleDebug --stacktrace --no-daemon

      - name: Restore deterministic testing keystore
        run: |
          mkdir -p "$RUNNER_TEMP/mediascribe"
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = 'https://api.github.com/repos/bumptech/glide/git/blobs/425f3d6a11b16ba70f68532876a6cce31e2a2bbd'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)
          target = os.path.join(os.environ['RUNNER_TEMP'], 'mediascribe', 'debug.keystore')
          with open(target, 'wb') as handle:
              handle.write(base64.b64decode(payload['content']))
          PY

      - name: Sign fixed-key upgradeable APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mediascribe/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MediaScribe-v1.1.0-arm64.apk \
            MediaScribe/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs MediaScribe-v1.1.0-arm64.apk | tee signing-verify.txt
          grep -Fq "3399e3c09011fc06fb5b4ade78deebbc0f611ff1ceea3af7c79c0fc404dffcff" signing-verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MediaScribe-v1.1.0-arm64
          path: MediaScribe-v1.1.0-arm64.apk
          if-no-files-found: error
          retention-days: 30
