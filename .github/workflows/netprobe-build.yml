name: Build NetProbe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NetProbe/**'
      - '.github/workflows/netprobe-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 37
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: NetProbe
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp NetProbe/app/build/outputs/apk/debug/app-debug.apk NetProbe-debug-v1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NetProbe-debug-v1.1.0
          path: NetProbe-debug-v1.1.0.apk
          if-no-files-found: error
