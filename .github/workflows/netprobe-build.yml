name: Build NetProbe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NetProbe/**'
      - '.github/workflows/netprobe-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: NetProbe
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp NetProbe/app/build/outputs/apk/debug/app-debug.apk NetProbe-debug-v1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NetProbe-debug-v1.1.0
          path: NetProbe-debug-v1.1.0.apk
          if-no-files-found: error
