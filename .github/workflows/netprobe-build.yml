name: Build NetProbe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'NetProbe-Android-v1.1.0.zip'
      - '.github/workflows/netprobe-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Extract NetProbe source
        run: unzip -q -o NetProbe-Android-v1.1.0.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: NetProbe
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp NetProbe/app/build/outputs/apk/debug/app-debug.apk NetProbe-debug-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetProbe-debug-v1.1.0
          path: NetProbe-debug-v1.1.0.apk
          if-no-files-found: error
