name: Build OPPO Health Bridge APK

on:
  push:
    branches:
      - oppo-health-bridge-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPPO_SIGNING_STORE_FILE: ${{ github.workspace }}/.ci-signing/oppo-health-bridge-dev.jks
      OPPO_SIGNING_STORE_PASSWORD: ${{ secrets.OPPO_SIGNING_STORE_PASSWORD || 'oppohealthdev' }}
      OPPO_SIGNING_KEY_ALIAS: oppohealthbridge
      OPPO_SIGNING_KEY_PASSWORD: ${{ secrets.OPPO_SIGNING_KEY_PASSWORD || 'oppohealthdev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore development signing key
        if: ${{ secrets.OPPO_SIGNING_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: .ci-signing/oppo-health-bridge-dev.jks
          key: oppo-health-bridge-dev-signing-v1

      - name: Prepare stable signing key
        env:
          OPPO_SIGNING_KEYSTORE_BASE64: ${{ secrets.OPPO_SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .ci-signing
          if [ -n "$OPPO_SIGNING_KEYSTORE_BASE64" ]; then
            echo "$OPPO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$OPPO_SIGNING_STORE_FILE"
            echo "Using keystore supplied by GitHub Secret."
          elif [ ! -s "$OPPO_SIGNING_STORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$OPPO_SIGNING_STORE_FILE" \
              -storepass "$OPPO_SIGNING_STORE_PASSWORD" \
              -keypass "$OPPO_SIGNING_KEY_PASSWORD" \
              -alias "$OPPO_SIGNING_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OPPO Health Bridge Dev, OU=Personal, O=zhuchenyu2008, L=Ningbo, ST=Zhejiang, C=CN"
            echo "Generated a development signing key. Actions Cache will reuse it on later builds."
          else
            echo "Reusing cached development signing key."
          fi

      - name: Print signing fingerprints
        run: |
          keytool -list -v \
            -keystore "$OPPO_SIGNING_STORE_FILE" \
            -storepass "$OPPO_SIGNING_STORE_PASSWORD" \
            -alias "$OPPO_SIGNING_KEY_ALIAS" \
            | tee signing-fingerprint.txt

      - name: Build debug APK
        run: gradle -p oppo-health-bridge :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp oppo-health-bridge/app/build/outputs/apk/debug/app-debug.apk \
            oppo-health-bridge/app/build/outputs/apk/debug/OPPO-Health-Bridge-v0.3.0.apk

      - name: Upload APK and fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-Health-Bridge-v0.3.0
          path: |
            oppo-health-bridge/app/build/outputs/apk/debug/OPPO-Health-Bridge-v0.3.0.apk
            signing-fingerprint.txt
          if-no-files-found: error
          retention-days: 30
