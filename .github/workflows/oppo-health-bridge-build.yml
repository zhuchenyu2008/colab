name: Build OPPO Health Bridge APK

on:
  push:
    branches:
      - oppo-health-bridge-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download OPPO Health SDK 2.1.7
        run: |
          mkdir -p oppo-health-bridge/app/libs
          curl -L --fail --retry 3 \
            -o oppo-health-bridge/app/libs/oppo-health-sdk-2.1.7.aar \
            https://raw.githubusercontent.com/yangxiaowai/EmoBit/main/android/app/libs/oppo-health-sdk-2.1.7.aar
          test -s oppo-health-bridge/app/libs/oppo-health-sdk-2.1.7.aar

      - name: Build debug APK
        run: gradle -p oppo-health-bridge :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp oppo-health-bridge/app/build/outputs/apk/debug/app-debug.apk \
            oppo-health-bridge/app/build/outputs/apk/debug/OPPO-Health-Bridge-v0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-Health-Bridge-v0.1.0
          path: oppo-health-bridge/app/build/outputs/apk/debug/OPPO-Health-Bridge-v0.1.0.apk
          if-no-files-found: error
          retention-days: 7
