name: Build OPPO Watch Sensor Probe APK

on:
  push:
    branches:
      - oppo-watch-sensor-probe-work
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WATCH_PROBE_SIGNING_STORE_FILE: ${{ github.workspace }}/.ci-signing/oppo-watch-probe-dev.jks
      WATCH_PROBE_SIGNING_STORE_PASSWORD: watchprobedev
      WATCH_PROBE_SIGNING_KEY_ALIAS: watchprobe
      WATCH_PROBE_SIGNING_KEY_PASSWORD: watchprobedev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore watch probe signing key
        uses: actions/cache@v4
        with:
          path: .ci-signing/oppo-watch-probe-dev.jks
          key: oppo-watch-probe-dev-signing-v1

      - name: Prepare stable watch probe signing key
        run: |
          mkdir -p .ci-signing
          if [ ! -s "$WATCH_PROBE_SIGNING_STORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$WATCH_PROBE_SIGNING_STORE_FILE" \
              -storepass "$WATCH_PROBE_SIGNING_STORE_PASSWORD" \
              -keypass "$WATCH_PROBE_SIGNING_KEY_PASSWORD" \
              -alias "$WATCH_PROBE_SIGNING_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OPPO Watch Sensor Probe Dev, OU=Personal, O=zhuchenyu2008, L=Ningbo, ST=Zhejiang, C=CN"
          fi

      - name: Build debug APK
        run: gradle -p oppo-watch-probe :app:assembleDebug --stacktrace

      - name: Verify APK and print certificate
        run: |
          APK="oppo-watch-probe/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee watch-probe-signing.txt
          sha256sum "$APK" | tee watch-probe-apk-sha256.txt
          cp "$APK" oppo-watch-probe/app/build/outputs/apk/debug/OPPO-Watch-Sensor-Probe-v0.1.0.apk

      - name: Upload APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-Watch-Sensor-Probe-v0.1.0
          path: |
            oppo-watch-probe/app/build/outputs/apk/debug/OPPO-Watch-Sensor-Probe-v0.1.0.apk
            watch-probe-signing.txt
            watch-probe-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
