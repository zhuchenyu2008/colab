name: Build Video Face Search Android APK

on:
  push:
    branches: [video-face-search-android]
    paths:
      - 'VideoFaceSearchAndroid/**'
      - '.github/workflows/video-face-search-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK
        run: gradle -p VideoFaceSearchAndroid :app:assembleDebug --stacktrace
      - name: Package APK
        run: |
          cp VideoFaceSearchAndroid/app/build/outputs/apk/debug/app-debug.apk VideoFaceSearch-Android-v0.2.0.apk
          ls -lh VideoFaceSearch-Android-v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFaceSearch-Android-v0.2.0
          path: VideoFaceSearch-Android-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
