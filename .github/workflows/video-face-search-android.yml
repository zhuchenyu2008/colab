name: Build Video Face Search Android APK

on:
  push:
    branches: [video-face-search-android]
    paths:
      - 'VideoFaceSearchAndroid/**'
      - '.github/workflows/video-face-search-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK
        run: gradle -p VideoFaceSearchAndroid :app:assembleDebug --stacktrace
      - name: Package APK
        run: |
          cp VideoFaceSearchAndroid/app/build/outputs/apk/debug/app-debug.apk VideoFaceSearch-Android-v0.1.0.apk
          ls -lh VideoFaceSearch-Android-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VideoFaceSearch-Android-v0.1.0
          path: VideoFaceSearch-Android-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30
