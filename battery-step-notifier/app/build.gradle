plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhuchenyu.batterystep'
    compileSdk 36

    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.zhuchenyu.batterystep"
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName "1.0.19"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
