plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhuchenyu.batterystep'
    compileSdk 36

    defaultConfig {
        applicationId "com.zhuchenyu.batterystep"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "1.0.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
